name: Tools Tests

on:
  push:
    branches:
      - main
    paths:
      - 'tools/**'

  pull_request:
    branches:
      - main
    paths:
      - 'tools/**'

jobs:
  qm-unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install tmt

      - name: Run QM unit tests
        run: |
          tmt --feeling-safe run -v plan --name unit

  qmctl-unit-tests:
    runs-on: ubuntu-latest
    container: python:3.11-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov flake8 pydocstyle

      - name: Run pytest
        run: |
          pytest --cov=qmctl --cov-report=term-missing tools/tests

      - name: Lint code
        run: |
          flake8 tools/
          pydocstyle tools/
